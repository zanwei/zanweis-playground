name: ChatGPTModelSelector
options:
  bundleIdPrefix: com.zanwei
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
targets:
  ChatGPTModelSelector:
    type: framework
    platform: iOS
    sources:
      - path: ChatGPTModelSelector
        excludes:
          - Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zanwei.ChatGPTModelSelectorKit
        GENERATE_INFOPLIST_FILE: YES
  ChatGPTModelSelectorDemo:
    type: application
    platform: iOS
    sources:
      - path: ChatGPTModelSelectorDemo
    resources:
      - path: ChatGPTModelSelector/Assets.xcassets
    dependencies:
      - target: ChatGPTModelSelector
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zanwei.ChatGPTModelSelectorDemo
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
  ChatGPTModelSelectorTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ChatGPTModelSelectorTests
    dependencies:
      - target: ChatGPTModelSelector
