    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "zanwei’s playground",
        "url": "https://zanweis-playground.zanwei.workers.dev/",

    <script>
      // Buffer real input that arrives before the body scripts load. Pointer
      // samples stay exact; a keyboard-only "/" is handed off so Social can
      // choose a deterministic temporary anchor after boot.
      (function () {
        var state = {
          point: null,
          slash: false,
          dispose: dispose,
        };
        var blurTimer = 0;

        function isEditableEvent(event) {
          var path =
            typeof event.composedPath === 'function'
              ? event.composedPath()
              : [event.target];
          return path.some(function (node) {
            return (
              node &&
              node.nodeType === 1 &&
              (node.tagName === 'INPUT' ||
                node.tagName === 'TEXTAREA' ||
                node.tagName === 'SELECT' ||
                node.isContentEditable)
            );
          });
        }

        function rememberPointer(event) {
          if (event.type === 'pointerdown') state.slash = false;
          if (
            event.pointerType &&
            event.pointerType !== 'mouse' &&
            event.pointerType !== 'pen'
          ) {
            return;
          }
          if (!Number.isFinite(event.clientX) || !Number.isFinite(event.clientY)) {
            return;
          }
          if (state.point) {
            state.point.x = event.clientX;
            state.point.y = event.clientY;
          } else {
            state.point = {
              x: event.clientX,
              y: event.clientY,
            };
          }
        }

        function rememberSlash(event) {
          if (event.isComposing || event.keyCode === 229) return;
          if (event.key === 'Escape') {
            state.slash = false;
            return;
          }
          if (
            event.key !== '/' ||
            event.defaultPrevented ||
            event.repeat ||
            event.metaKey ||
            event.ctrlKey ||
            event.altKey ||
            isEditableEvent(event)
          ) {
            return;
          }
          event.preventDefault();
          state.slash = true;
        }

        function forgetPointer(event) {
          if (
            (event.pointerType &&
              event.pointerType !== 'mouse' &&
              event.pointerType !== 'pen') ||
            event.relatedTarget !== null
          ) {
            return;
          }
          state.point = null;
          state.slash = false;
        }

        function clearBufferedInput() {
          state.point = null;
          state.slash = false;
        }

        function cancelBufferedBlur() {
          clearTimeout(blurTimer);
          blurTimer = 0;
        }

        function scheduleBufferedBlur() {
          cancelBufferedBlur();
          blurTimer = setTimeout(function () {
            blurTimer = 0;
            // Focusing a same-origin iframe briefly blurs the parent Window.
            // Keep the shortcut if the document still owns the focus chain.
            if (document.hasFocus && document.hasFocus()) return;
            clearBufferedInput();
          }, 32);
        }

        function cancelSlashForFocus(event) {
          // Programmatic focus restoration during boot must not eat a slash.
          // Only a typing surface has actually taken ownership of the key.
          if (isEditableEvent(event)) state.slash = false;
        }

        function dispose() {
          cancelBufferedBlur();
          removeEventListener('pointerover', rememberPointer, true);
          removeEventListener('pointerenter', rememberPointer, true);
          removeEventListener('pointermove', rememberPointer, true);
          removeEventListener('pointerdown', rememberPointer, true);
          removeEventListener('pointerout', forgetPointer, true);
          removeEventListener('keydown', rememberSlash, true);
          removeEventListener('blur', scheduleBufferedBlur, true);
          removeEventListener('focus', cancelBufferedBlur, true);
          document.removeEventListener(
            'visibilitychange',
            clearBufferedInput,
            true
          );
          document.removeEventListener('focusin', cancelSlashForFocus, true);
        }

        window.__cursorChatBootstrap = state;
        addEventListener('pointerover', rememberPointer, {
          capture: true,
          passive: true,
        });
        addEventListener('pointerenter', rememberPointer, {
          capture: true,
          passive: true,
        });
        addEventListener('pointermove', rememberPointer, {
          capture: true,
          passive: true,
        });
        addEventListener('pointerdown', rememberPointer, {
          capture: true,
          passive: true,
        });
        addEventListener('pointerout', forgetPointer, {
          capture: true,
          passive: true,
        });
        addEventListener('keydown', rememberSlash, true);
        addEventListener('blur', scheduleBufferedBlur, true);
        addEventListener('focus', cancelBufferedBlur, true);
        document.addEventListener(
          'visibilitychange',
          clearBufferedInput,
          true
        );
        document.addEventListener('focusin', cancelSlashForFocus, true);
      })();
    </script>
    <link rel="stylesheet" href="styles.css" />

    <script>
      // Mark the boot phase before first paint so card entrances stay paused
      // under the loader. A brand-click refresh sets a one-shot flag that
      // skips the intro entirely. Dead-man's switch: if boot.js never runs,
      // release the page anyway so the loader can't trap it.
      (function () {
        var skip = false;
        try {
          skip = sessionStorage.getItem('zw-skip-boot') === '1';
          if (skip) sessionStorage.removeItem('zw-skip-boot');
        } catch (e) {}
        if (skip) {
          document.documentElement.classList.add('boot-skip');
          return;
        }
        document.documentElement.classList.add('booting');
        // The intro doubles the document height, so a restored scroll offset
        // would land the page mid-air. Own the scroll position ourselves.
        try {
          history.scrollRestoration = 'manual';
        } catch (e) {}
        addEventListener('DOMContentLoaded', function () {
          scrollTo(0, 0);
        });
        window.__bootFailsafe = setTimeout(function () {
          window.__bootComplete = true;
          document.documentElement.classList.remove('booting', 'revealing');
          var b = document.getElementById('boot');
          if (b) b.setAttribute('data-hidden', '');
          dispatchEvent(new Event('boot:done'));
        }, 5200);
      })();
    </script>

  <body>
    <div class="boot" id="boot" aria-hidden="true">
      <div class="boot-grid" id="boot-grid"></div>
    </div>

    <div class="sheet" id="sheet">
    <div class="shell">
      <div class="top-sentinel" aria-hidden="true"></div>
      <header class="topbar" id="topbar" data-anchor="shell:brand">
        <a class="brand" href="./" aria-label="zanwei’s playground">
          <svg class="brand-face" viewBox="0 0 199 198" aria-hidden="true"><path d="" /></svg>
        </a>
        <div class="topbar-tools">
          <button
            class="chat-hint"
            id="chat-hint"
            title="Open cursor chat"
            aria-label="Open cursor chat"
            aria-controls="cursor-chat-composer"
            aria-expanded="false"
          >
            <kbd>/</kbd>
            <span>for chat</span>
          </button>
        <div class="online-wrap">
          <button
            class="online"
            id="online-btn"
            title="People on this page right now"
            aria-haspopup="dialog"
            aria-expanded="false"
          >
            <span class="online-dot" aria-hidden="true"></span>
            <span class="t-digit-group" id="online-count"><span class="t-digit">1</span></span>
            <span class="online-label">online</span>
          </button>
          <div class="globe-pop" id="globe-pop" role="dialog" aria-label="Who's here" hidden>
            <div class="globe-wrap" id="globe-wrap"></div>
          </div>
        </div>
        </div>
      </header>

      <main class="main">
        <h1 class="visually-hidden">zanwei’s playground</h1>
        <section class="masonry" id="masonry" aria-label="Component gallery"></section>
      </main>
    </div>
    </div>

    <div class="playground" id="playground" hidden>
      <div class="playground-backdrop" id="pg-backdrop"></div>
      <div
        class="playground-window"
        role="dialog"
        aria-modal="true"
        aria-labelledby="pg-title"
        data-anchor="shell:playground"
      >
        <header class="playground-head">
          <h2 class="playground-title" id="pg-title"></h2>
          <div class="playground-actions">
            <a class="playground-source" id="pg-github" target="_blank" rel="noopener">
              Source
              <svg width="12" height="12" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M7 17 17 7M9 7h8v8" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </a>
            <button class="playground-close" id="pg-close" aria-label="Close playground">
              <svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" />
              </svg>
            </button>
          </div>
        </header>
        <div class="playground-body" id="pg-body">
          <iframe class="playground-frame" id="pg-frame" title="Component playground"></iframe>
          <img class="pg-thumb" id="pg-thumb" alt="" hidden />
          <video
            class="pg-video"
            id="pg-video"
            muted
            loop
            playsinline
            preload="metadata"
            aria-hidden="true"
            hidden
          ></video>
        </div>
      </div>
    </div>

    <script src="catalog.js"></script>
    <script src="vendor/cobe.js"></script>
    <script src="social.js"></script>
    <script src="fountain.js"></script>
    <script src="presence.js"></script>
    <script src="app.js"></script>
    <script src="boot.js"></script>
